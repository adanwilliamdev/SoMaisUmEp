<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claquete · séries e filmes</title>
<meta name="description" content="Seu diário de séries e filmes: progresso por episódio, filmes assistidos e tops 10.">
<meta name="theme-color" content="#12121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claquete">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Instrument+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/tema.js"></script>
<link rel="modulepreload" href="/js/main.js">
</head>
<body class="deslogado">
<div id="faixa" class="faixa" role="status" hidden></div>
<div class="wrap">
  <header class="topo">
    <a class="marca" href="#series" class="marca-link"><i aria-hidden="true"></i> Claquete</a>
    <nav class="menu" aria-label="Principal">
      <a href="#series"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Séries</span></a>
      <a href="#filmes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg><span>Filmes</span></a>
      <a href="#tops"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span>Tops</span></a>
      <a href="#stats"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Estatísticas</span></a>
    </nav>
    <div class="acoes-topo">
      <button class="icone" id="tema" data-act="tema" type="button" aria-label="Mudar o tema"></button>
      <button class="icone conta" id="conta" data-act="conta" type="button" aria-label="Minha conta"></button>
    </div>
  </header>
  <main id="app"></main>
  <footer class="rodape">
    <span id="status" role="status"></span>
    <button class="btn sec mini" data-act="backup">Backup</button>
    <button class="btn sec mini" data-act="sair">Sair</button>
    <span>Dados e imagens: TMDB; streaming: JustWatch. Este produto usa a API do TMDB, mas não é endossado nem certificado por ele.</span>
  </footer>
</div>
<div id="avisos" class="avisos" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script type="module" src="/js/main.js"></script>
</body>
</html>
